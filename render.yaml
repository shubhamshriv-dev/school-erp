services:
  - type: web
    name: school-erp
    runtime: node
    plan: free
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm build
    startCommand: corepack pnpm start
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: school-erp-db
          property: connectionString

databases:
  - name: school-erp-db
    plan: free
    databaseName: school_erp
    user: school
